name: Linux Production Build

on:
  workflow_dispatch:
  push:
    branches:
      - ci/linux-production-build

jobs:
  build:
    name: Build Next.js on Linux
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci -d ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
        run: pnpm exec prisma generate

      - name: Apply Prisma migrations
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
        run: pnpm exec prisma migrate deploy

      - name: Validate VAPID configuration
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: |
          node <<'NODE'
          const webpush = require("web-push");

          const publicKey = process.env.VAPID_PUBLIC_KEY?.trim();
          const privateKey = process.env.VAPID_PRIVATE_KEY?.trim();
          const subject = process.env.VAPID_SUBJECT?.trim();

          console.log(
            "VAPID_PUBLIC_KEY:",
            publicKey ? `SET (${publicKey.length} chars)` : "MISSING"
          );

          console.log(
            "VAPID_PRIVATE_KEY:",
            privateKey ? `SET (${privateKey.length} chars)` : "MISSING"
          );

          console.log(
            "VAPID_SUBJECT:",
            subject ? "SET" : "MISSING"
          );

          if (!publicKey || !privateKey || !subject) {
            throw new Error("VAPID environment variable is missing");
          }

          webpush.setVapidDetails(
            subject,
            publicKey,
            privateKey
          );

          console.log("VAPID_CONFIG_OK");
          NODE

      - name: Build production
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: pnpm build

      - name: Package Prisma Client for production artifact
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching generated Prisma Client..."

          PRISMA_CLIENT_DIR="$(
            find node_modules/.pnpm \
              -type d \
              -path '*/node_modules/.prisma/client' \
              -print -quit
          )"

          if [ -z "$PRISMA_CLIENT_DIR" ]; then
            echo "ERROR: Generated Prisma Client not found"
            exit 1
          fi

          echo ""
          echo "Generated Prisma Client:"
          echo "$PRISMA_CLIENT_DIR"

          echo ""
          echo "Checking generated Prisma Client..."

          if [ ! -f "$PRISMA_CLIENT_DIR/default.js" ]; then
            echo "ERROR: Prisma default.js not found"
            exit 1
          fi

          if [ ! -f "$PRISMA_CLIENT_DIR/libquery_engine-debian-openssl-3.0.x.so.node" ]; then
            echo "ERROR: Linux Prisma query engine not found"
            exit 1
          fi

          echo "Linux Prisma Client files OK."

          echo ""
          echo "Creating .next/node_modules/.prisma/client..."

          mkdir -p .next/node_modules/.prisma/client

          cp -a "$PRISMA_CLIENT_DIR"/. \
            .next/node_modules/.prisma/client/

          echo ""
          echo "Packaged Prisma Client:"
          find .next/node_modules/.prisma/client \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

          echo ""
          echo "Validating packaged Prisma Client..."

          node -e "
            const p = require('./.next/node_modules/.prisma/client/default.js');

            if (typeof p.PrismaClient !== 'function') {
              throw new Error('PrismaClient export is not available');
            }

            console.log('PACKAGED_PRISMA_CLIENT_OK');
            console.log('PrismaClient:', typeof p.PrismaClient);
          "

          echo ""
          echo "Checking @prisma/client package inside production artifact..."

          PRISMA_PACKAGE_COUNT="$(
            find .next \
              -type f \
              -path '*/@prisma/client*/package.json' \
              | wc -l
          )"

          echo "Detected @prisma/client package.json files: $PRISMA_PACKAGE_COUNT"

          if [ "$PRISMA_PACKAGE_COUNT" -eq 0 ]; then
            echo "ERROR: @prisma/client package was not included in production artifact"
            exit 1
          fi

          echo ""
          echo "Detected @prisma/client packages:"

          find .next \
            -type f \
            -path '*/@prisma/client*/package.json' \
            -print

          echo ""
          echo "Testing Prisma resolution from production artifact..."

          PRISMA_PACKAGE_JSON="$(
            find .next \
              -type f \
              -path '*/@prisma/client*/package.json' \
              -print -quit
          )"

          PRISMA_PACKAGE_DIR="$(dirname "$PRISMA_PACKAGE_JSON")"

          echo ""
          echo "Prisma package directory:"
          echo "$PRISMA_PACKAGE_DIR"

          if [ ! -f "$PRISMA_PACKAGE_DIR/default.js" ]; then
            echo "ERROR: @prisma/client default.js not found"
            exit 1
          fi

          echo ""
          echo "Testing @prisma/client default.js..."

          node -e "
            const p = require('./$PRISMA_PACKAGE_DIR/default.js');

            if (typeof p.PrismaClient !== 'function') {
              throw new Error('PrismaClient export is not available from @prisma/client');
            }

            console.log('PRISMA_PACKAGE_RESOLUTION_OK');
            console.log('PrismaClient:', typeof p.PrismaClient);
          "

          echo ""
          echo "Prisma production packaging validation PASSED."

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: next-production-build
          path: .next
          include-hidden-files: true
          retention-days: 7
