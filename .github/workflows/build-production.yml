name: Linux Production Build

on:
  workflow_dispatch:
  push:
    branches:
      - ci/linux-production-build

jobs:
  build:
    name: Build Next.js on Linux
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci -d ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
        run: pnpm exec prisma generate

      - name: Apply Prisma migrations
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
        run: pnpm exec prisma migrate deploy

      - name: Validate VAPID configuration
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: |
          node <<'NODE'
          const webpush = require("web-push");

          const publicKey = process.env.VAPID_PUBLIC_KEY?.trim();
          const privateKey = process.env.VAPID_PRIVATE_KEY?.trim();
          const subject = process.env.VAPID_SUBJECT?.trim();

          console.log(
            "VAPID_PUBLIC_KEY:",
            publicKey ? `SET (${publicKey.length} chars)` : "MISSING"
          );

          console.log(
            "VAPID_PRIVATE_KEY:",
            privateKey ? `SET (${privateKey.length} chars)` : "MISSING"
          );

          console.log(
            "VAPID_SUBJECT:",
            subject ? "SET" : "MISSING"
          );

          if (!publicKey || !privateKey || !subject) {
            throw new Error("VAPID environment variable is missing");
          }

          webpush.setVapidDetails(
            subject,
            publicKey,
            privateKey
          );

          console.log("VAPID_CONFIG_OK");
          NODE

      - name: Build production
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}

          # Next.js Server Actions
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
          DEPLOYMENT_VERSION: ${{ github.sha }}

          # VAPID
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}

          # OneSignal
          NEXT_PUBLIC_ONESIGNAL_APP_ID: ${{ vars.NEXT_PUBLIC_ONESIGNAL_APP_ID }}
        run: pnpm build

      - name: Verify production build
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "PRODUCTION BUILD VERIFICATION"
          echo "========================================"

          if [ ! -f ".next/BUILD_ID" ]; then
            echo "ERROR: .next/BUILD_ID not found"
            exit 1
          fi

          BUILD_ID="$(cat .next/BUILD_ID)"

          echo "Commit SHA : $GITHUB_SHA"
          echo "Build ID   : $BUILD_ID"
          echo "Branch     : $GITHUB_REF_NAME"

          echo
          echo "=== Product JSON-LD ==="

          PRODUCT_COUNT="$(
            grep -R \
              --include='*.js' \
              -o '"@type":"Product"' \
              .next/server 2>/dev/null \
              | wc -l \
              | tr -d ' '
          )"

          echo "Product count: $PRODUCT_COUNT"

          if [ "$PRODUCT_COUNT" -lt 1 ]; then
            echo "ERROR: Product JSON-LD not found"
            exit 1
          fi

          echo
          echo "=== AggregateOffer JSON-LD ==="

          OFFER_COUNT="$(
            grep -R \
              --include='*.js' \
              -o '"@type":"AggregateOffer"' \
              .next/server 2>/dev/null \
              | wc -l \
              | tr -d ' '
          )"

          echo "AggregateOffer count: $OFFER_COUNT"

          if [ "$OFFER_COUNT" -lt 1 ]; then
            echo "ERROR: AggregateOffer JSON-LD not found"
            exit 1
          fi

          echo
          echo "=== BreadcrumbList JSON-LD ==="

          BREADCRUMB_COUNT="$(
            grep -R \
              --include='*.js' \
              -o '"@type":"BreadcrumbList"' \
              .next/server 2>/dev/null \
              | wc -l \
              | tr -d ' '
          )"

          echo "BreadcrumbList count: $BREADCRUMB_COUNT"

          if [ "$BREADCRUMB_COUNT" -lt 1 ]; then
            echo "ERROR: BreadcrumbList JSON-LD not found"
            exit 1
          fi

          echo
          echo "=== Production domain ==="

          PRODUCTION_DOMAIN_COUNT="$(
            grep -R \
              --include='*.js' \
              -o 'https://app\.pusatikansegar\.com' \
              .next/server 2>/dev/null \
              | wc -l \
              | tr -d ' '
          )"

          echo "Production domain references: $PRODUCTION_DOMAIN_COUNT"

          if [ "$PRODUCTION_DOMAIN_COUNT" -lt 1 ]; then
            echo "ERROR: Production domain not found in server build"
            exit 1
          fi

          echo
          echo "=== Localhost reference audit ==="

          LOCALHOST_COUNT="$(
            grep -R \
              --include='*.js' \
              -oE 'https?://localhost:[0-9]+' \
              .next/server 2>/dev/null \
              | wc -l \
              | tr -d ' '
          )"

          echo "Localhost references in Next.js server bundle: $LOCALHOST_COUNT"

          if [ "$LOCALHOST_COUNT" -gt 0 ]; then
            echo "WARNING: localhost references exist inside the Next.js server bundle."
            echo "This is informational only because Next.js internal runtime code may contain localhost references."
          else
            echo "No localhost references detected."
          fi

          echo
          echo "========================================"
          echo "BUILD VERIFICATION PASSED"
          echo "========================================"

          echo "BUILD_ID=$BUILD_ID"
          echo "COMMIT_SHA=$GITHUB_SHA"
          echo "PRODUCT_COUNT=$PRODUCT_COUNT"
          echo "OFFER_COUNT=$OFFER_COUNT"
          echo "BREADCRUMB_COUNT=$BREADCRUMB_COUNT"
          echo "PRODUCTION_DOMAIN_COUNT=$PRODUCTION_DOMAIN_COUNT"
          echo "LOCALHOST_COUNT=$LOCALHOST_COUNT"

      - name: Package Prisma Client for production artifact
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching generated Prisma Client..."

          PRISMA_CLIENT_DIR="$(
            find node_modules/.pnpm \
              -type d \
              -path '*/node_modules/.prisma/client' \
              -print -quit
          )"

          if [ -z "$PRISMA_CLIENT_DIR" ]; then
            echo "ERROR: Generated Prisma Client not found"
            exit 1
          fi

          echo ""
          echo "Generated Prisma Client:"
          echo "$PRISMA_CLIENT_DIR"

          echo ""
          echo "Checking Linux Prisma query engine..."

          if [ ! -f "$PRISMA_CLIENT_DIR/libquery_engine-debian-openssl-3.0.x.so.node" ]; then
            echo "ERROR: Linux Prisma query engine not found"
            exit 1
          fi

          echo "Linux Prisma query engine found."

          echo ""
          echo "Packaging Prisma Client..."

          mkdir -p .next/node_modules/.prisma/client

          cp -a "$PRISMA_CLIENT_DIR"/. \
            .next/node_modules/.prisma/client/

          echo ""
          echo "Validating root packaged Prisma Client..."

          if [ ! -f ".next/node_modules/.prisma/client/default.js" ]; then
            echo "ERROR: Root Prisma default.js missing"
            exit 1
          fi

          if [ ! -f ".next/node_modules/.prisma/client/libquery_engine-debian-openssl-3.0.x.so.node" ]; then
            echo "ERROR: Root Linux Prisma engine missing"
            exit 1
          fi

          node -e "
            const p = require('./.next/node_modules/.prisma/client/default.js');

            if (typeof p.PrismaClient !== 'function') {
              throw new Error('PrismaClient export is not available');
            }

            console.log('ROOT_PACKAGED_PRISMA_CLIENT_OK');
            console.log('PrismaClient:', typeof p.PrismaClient);
          "

          echo ""
          echo "Searching hashed @prisma/client packages..."

          FOUND_PRISMA_PACKAGE=false

          for PKG in .next/node_modules/@prisma/client-*; do
            if [ ! -d "$PKG" ]; then
              continue
            fi

            FOUND_PRISMA_PACKAGE=true

            echo ""
            echo "Found Prisma package:"
            echo "  $PKG"

            echo "Packaging Prisma runtime into:"
            echo "  $PKG/node_modules/.prisma/client"

            mkdir -p "$PKG/node_modules/.prisma"

            rm -rf "$PKG/node_modules/.prisma/client"

            cp -a .next/node_modules/.prisma/client \
              "$PKG/node_modules/.prisma/"

            if [ ! -f "$PKG/node_modules/.prisma/client/default.js" ]; then
              echo "ERROR: Prisma default.js missing in:"
              echo "  $PKG/node_modules/.prisma/client/default.js"
              exit 1
            fi

            if [ ! -f "$PKG/node_modules/.prisma/client/libquery_engine-debian-openssl-3.0.x.so.node" ]; then
              echo "ERROR: Linux Prisma engine missing in:"
              echo "  $PKG/node_modules/.prisma/client/libquery_engine-debian-openssl-3.0.x.so.node"
              exit 1
            fi

            echo "Validating Prisma package runtime..."

            node -e "
              const path = require('path');
              const pkg = path.resolve('$PKG');
              const p = require(path.join(
                pkg,
                'node_modules/.prisma/client/default.js'
              ));

              if (typeof p.PrismaClient !== 'function') {
                throw new Error(
                  'PrismaClient export is not available from ' + pkg
                );
              }

              console.log('HASHED_PRISMA_CLIENT_OK');
              console.log('Package:', pkg);
              console.log('PrismaClient:', typeof p.PrismaClient);
            "
          done

          if [ "$FOUND_PRISMA_PACKAGE" = false ]; then
            echo "ERROR: No hashed @prisma/client-* package found"
            exit 1
          fi

          echo ""
          echo "Inspecting packaged Prisma paths..."

          find .next/node_modules \
            -type f \
            \( \
              -path '*/@prisma/*' \
              -o -path '*/.prisma/*' \
            \) \
            -print \
            | sort \
            | head -500

          echo ""
          echo "Prisma production packaging validation PASSED."

      - name: Create artifact metadata
        shell: bash
        run: |
          set -euo pipefail

          BUILD_ID="$(cat .next/BUILD_ID)"

          mkdir -p .next/deploy-meta

          cat > .next/deploy-meta/build-info.txt <<EOF
          COMMIT_SHA=$GITHUB_SHA
          BRANCH=$GITHUB_REF_NAME
          BUILD_ID=$BUILD_ID
          WORKFLOW_RUN_ID=$GITHUB_RUN_ID
          WORKFLOW_RUN_NUMBER=$GITHUB_RUN_NUMBER
          REPOSITORY=$GITHUB_REPOSITORY
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          EOF

          echo "========================================"
          echo "ARTIFACT METADATA"
          echo "========================================"

          cat .next/deploy-meta/build-info.txt

      - name: Package production artifact
        shell: bash
        run: |
          set -euo pipefail

          rm -f next-production-build.zip

          echo "========================================"
          echo "PACKAGING PRODUCTION ARTIFACT"
          echo "========================================"

          cd .next

          zip -qr ../next-production-build.zip .

          cd ..

          echo
          echo "Artifact:"
          ls -lh next-production-build.zip

          echo
          echo "Artifact BUILD_ID:"
          unzip -p next-production-build.zip BUILD_ID

          echo
          echo "Artifact metadata:"
          unzip -p next-production-build.zip deploy-meta/build-info.txt

          echo
          echo "Testing ZIP..."

          unzip -t next-production-build.zip >/tmp/next-artifact-test.log

          tail -5 /tmp/next-artifact-test.log

          echo
          echo "SHA256:"
          sha256sum next-production-build.zip

      - name: Validate production artifact
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "FINAL ARTIFACT VALIDATION"
          echo "========================================"

          if [ ! -f "next-production-build.zip" ]; then
            echo "ERROR: next-production-build.zip not found"
            exit 1
          fi

          echo
          echo "=== ZIP integrity ==="

          unzip -t next-production-build.zip >/tmp/next-artifact-final-test.log

          tail -5 /tmp/next-artifact-final-test.log

          echo
          echo "=== BUILD ID ==="

          ARTIFACT_BUILD_ID="$(unzip -p next-production-build.zip BUILD_ID)"

          echo "Artifact BUILD_ID: $ARTIFACT_BUILD_ID"

          if [ -z "$ARTIFACT_BUILD_ID" ]; then
            echo "ERROR: Artifact BUILD_ID is empty"
            exit 1
          fi

          echo
          echo "=== Metadata ==="

          unzip -p \
            next-production-build.zip \
            deploy-meta/build-info.txt

          echo
          echo "=== Product JSON-LD ==="

          ARTIFACT_PRODUCT_COUNT="$(
            unzip -p next-production-build.zip 'server/**/*.js' 2>/dev/null \
              | grep -o '"@type":"Product"' \
              | wc -l \
              | tr -d ' '
          )"

          echo "Artifact Product count: $ARTIFACT_PRODUCT_COUNT"

          if [ "$ARTIFACT_PRODUCT_COUNT" -lt 1 ]; then
            echo "ERROR: Product JSON-LD missing from artifact"
            exit 1
          fi

          echo
          echo "=== AggregateOffer JSON-LD ==="

          ARTIFACT_OFFER_COUNT="$(
            unzip -p next-production-build.zip 'server/**/*.js' 2>/dev/null \
              | grep -o '"@type":"AggregateOffer"' \
              | wc -l \
              | tr -d ' '
          )"

          echo "Artifact AggregateOffer count: $ARTIFACT_OFFER_COUNT"

          if [ "$ARTIFACT_OFFER_COUNT" -lt 1 ]; then
            echo "ERROR: AggregateOffer missing from artifact"
            exit 1
          fi

          echo
          echo "=== BreadcrumbList JSON-LD ==="

          ARTIFACT_BREADCRUMB_COUNT="$(
            unzip -p next-production-build.zip 'server/**/*.js' 2>/dev/null \
              | grep -o '"@type":"BreadcrumbList"' \
              | wc -l \
              | tr -d ' '
          )"

          echo "Artifact BreadcrumbList count: $ARTIFACT_BREADCRUMB_COUNT"

          if [ "$ARTIFACT_BREADCRUMB_COUNT" -lt 1 ]; then
            echo "ERROR: BreadcrumbList missing from artifact"
            exit 1
          fi

          echo
          echo "=== Prisma Linux engine ==="

          PRISMA_ENGINE_COUNT="$(
            unzip -l next-production-build.zip \
              | grep -c 'libquery_engine-debian-openssl-3.0.x.so.node' \
              || true
          )"

          echo "Prisma Linux engine count: $PRISMA_ENGINE_COUNT"

          if [ "$PRISMA_ENGINE_COUNT" -lt 1 ]; then
            echo "ERROR: Linux Prisma query engine missing from artifact"
            exit 1
          fi

          echo
          echo "========================================"
          echo "FINAL ARTIFACT VALIDATION PASSED"
          echo "========================================"

          echo "BUILD_ID=$ARTIFACT_BUILD_ID"
          echo "PRODUCT_COUNT=$ARTIFACT_PRODUCT_COUNT"
          echo "OFFER_COUNT=$ARTIFACT_OFFER_COUNT"
          echo "BREADCRUMB_COUNT=$ARTIFACT_BREADCRUMB_COUNT"
          echo "PRISMA_ENGINE_COUNT=$PRISMA_ENGINE_COUNT"

      - name: Validate production artifact
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "FINAL ARTIFACT VALIDATION"
          echo "========================================"

          if [ ! -f "next-production-build.zip" ]; then
            echo "ERROR: next-production-build.zip not found"
            exit 1
          fi

          echo
          echo "=== ZIP integrity ==="

          unzip -t next-production-build.zip >/tmp/next-artifact-final-test.log

          tail -5 /tmp/next-artifact-final-test.log

          echo
          echo "=== BUILD ID ==="

          ARTIFACT_BUILD_ID="$(unzip -p next-production-build.zip BUILD_ID)"

          echo "Artifact BUILD_ID: $ARTIFACT_BUILD_ID"

          if [ -z "$ARTIFACT_BUILD_ID" ]; then
            echo "ERROR: Artifact BUILD_ID is empty"
            exit 1
          fi

          echo
          echo "=== Metadata ==="

          unzip -p \
            next-production-build.zip \
            deploy-meta/build-info.txt

          echo
          echo "=== Product JSON-LD ==="

          ARTIFACT_PRODUCT_COUNT="$(
            unzip -p next-production-build.zip 'server/**/*.js' 2>/dev/null \
              | grep -o '"@type":"Product"' \
              | wc -l \
              | tr -d ' '
          )"

          echo "Artifact Product count: $ARTIFACT_PRODUCT_COUNT"

          if [ "$ARTIFACT_PRODUCT_COUNT" -lt 1 ]; then
            echo "ERROR: Product JSON-LD missing from artifact"
            exit 1
          fi

          echo
          echo "=== AggregateOffer JSON-LD ==="

          ARTIFACT_OFFER_COUNT="$(
            unzip -p next-production-build.zip 'server/**/*.js' 2>/dev/null \
              | grep -o '"@type":"AggregateOffer"' \
              | wc -l \
              | tr -d ' '
          )"

          echo "Artifact AggregateOffer count: $ARTIFACT_OFFER_COUNT"

          if [ "$ARTIFACT_OFFER_COUNT" -lt 1 ]; then
            echo "ERROR: AggregateOffer missing from artifact"
            exit 1
          fi

          echo
          echo "=== BreadcrumbList JSON-LD ==="

          ARTIFACT_BREADCRUMB_COUNT="$(
            unzip -p next-production-build.zip 'server/**/*.js' 2>/dev/null \
              | grep -o '"@type":"BreadcrumbList"' \
              | wc -l \
              | tr -d ' '
          )"

          echo "Artifact BreadcrumbList count: $ARTIFACT_BREADCRUMB_COUNT"

          if [ "$ARTIFACT_BREADCRUMB_COUNT" -lt 1 ]; then
            echo "ERROR: BreadcrumbList missing from artifact"
            exit 1
          fi

          echo
          echo "=== Prisma Linux engine ==="

          PRISMA_ENGINE_COUNT="$(
            unzip -l next-production-build.zip \
              | grep -c 'libquery_engine-debian-openssl-3.0.x.so.node' \
              || true
          )"

          echo "Prisma Linux engine count: $PRISMA_ENGINE_COUNT"

          if [ "$PRISMA_ENGINE_COUNT" -lt 1 ]; then
            echo "ERROR: Linux Prisma query engine missing from artifact"
            exit 1
          fi

          echo
          echo "========================================"
          echo "FINAL ARTIFACT VALIDATION PASSED"
          echo "========================================"

          echo "BUILD_ID=$ARTIFACT_BUILD_ID"
          echo "PRODUCT_COUNT=$ARTIFACT_PRODUCT_COUNT"
          echo "OFFER_COUNT=$ARTIFACT_OFFER_COUNT"
          echo "BREADCRUMB_COUNT=$ARTIFACT_BREADCRUMB_COUNT"
          echo "PRISMA_ENGINE_COUNT=$PRISMA_ENGINE_COUNT"

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-production-build-${{ github.sha }}
          path: next-production-build.zip
          if-no-files-found: error
          retention-days: 14
