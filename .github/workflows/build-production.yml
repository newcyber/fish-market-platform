name: Linux Production Build

on:
  workflow_dispatch:
  push:
    branches:
      - ci/linux-production-build

jobs:
  build:
    name: Build Next.js on Linux
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci -d ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
        run: pnpm exec prisma generate

      - name: Apply Prisma migrations
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
        run: pnpm exec prisma migrate deploy

      - name: Validate VAPID configuration
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: |
          node <<'NODE'
          const webpush = require("web-push");

          const publicKey = process.env.VAPID_PUBLIC_KEY?.trim();
          const privateKey = process.env.VAPID_PRIVATE_KEY?.trim();
          const subject = process.env.VAPID_SUBJECT?.trim();

          console.log(
            "VAPID_PUBLIC_KEY:",
            publicKey ? `SET (${publicKey.length} chars)` : "MISSING"
          );

          console.log(
            "VAPID_PRIVATE_KEY:",
            privateKey ? `SET (${privateKey.length} chars)` : "MISSING"
          );

          console.log(
            "VAPID_SUBJECT:",
            subject ? "SET" : "MISSING"
          );

          if (!publicKey || !privateKey || !subject) {
            throw new Error("VAPID environment variable is missing");
          }

          webpush.setVapidDetails(
            subject,
            publicKey,
            privateKey
          );

          console.log("VAPID_CONFIG_OK");
          NODE

      - name: Build production
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: pnpm build

      - name: Package Prisma Client for production artifact
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching generated Prisma Client..."

          PRISMA_CLIENT_DIR="$(
            find node_modules/.pnpm \
              -type d \
              -path '*/node_modules/.prisma/client' \
              -print -quit
          )"

          if [ -z "$PRISMA_CLIENT_DIR" ]; then
            echo "ERROR: Generated Prisma Client not found"
            exit 1
          fi

          echo ""
          echo "Generated Prisma Client:"
          echo "$PRISMA_CLIENT_DIR"

          echo ""
          echo "Generated Prisma Client contents:"
          find "$PRISMA_CLIENT_DIR" \
            -maxdepth 2 \
            -type f \
            -printf '%P\n' \
            | sort

          echo ""
          echo "Checking Prisma default.js..."

          if [ ! -f "$PRISMA_CLIENT_DIR/default.js" ]; then
            echo "ERROR: Prisma default.js not found"
            exit 1
          fi

          echo "Prisma default.js found."

          echo ""
          echo "Creating .next/node_modules/.prisma/client..."

          mkdir -p .next/node_modules/.prisma/client

          cp -a "$PRISMA_CLIENT_DIR"/. \
            .next/node_modules/.prisma/client/

          echo ""
          echo "Packaged Prisma Client:"
          find .next/node_modules/.prisma/client \
            -maxdepth 2 \
            -type f \
            -printf '%P\n' \
            | sort

          echo ""
          echo "Searching traced @prisma/client package..."

          TRACED_PRISMA_DIR="$(
            find .next/node_modules/@prisma \
              -maxdepth 1 \
              -type d \
              -name 'client-*' \
              -print -quit
          )"

          if [ -z "$TRACED_PRISMA_DIR" ]; then
            echo "ERROR: Traced @prisma/client package not found"
            exit 1
          fi

          echo ""
          echo "Traced Prisma package:"
          echo "$TRACED_PRISMA_DIR"

          if [ ! -f "$TRACED_PRISMA_DIR/default.js" ]; then
            echo "ERROR: Traced Prisma default.js not found"
            exit 1
          fi

          echo ""
          echo "Testing traced Prisma Client..."

          node -e "
            const p = require('./$TRACED_PRISMA_DIR/default.js');

            if (typeof p.PrismaClient !== 'function') {
              throw new Error('PrismaClient export is not available');
            }

            console.log('TRACED_PRISMA_OK');
            console.log('PrismaClient:', typeof p.PrismaClient);
          "

          echo ""
          echo "Verifying .prisma resolution..."

          node -e "
            const p = require('./$TRACED_PRISMA_DIR/default.js');

            if (!p.PrismaClient) {
              throw new Error('Failed to resolve .prisma/client/default');
            }

            console.log('PRISMA_RUNTIME_RESOLUTION_OK');
          "

          echo ""
          echo "Prisma production packaging validation PASSED."

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: next-production-build
          path: .next
          include-hidden-files: true
          retention-days: 7
