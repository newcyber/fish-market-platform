name: Linux Production Build & Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - ci/linux-production-build

permissions:
  contents: read

concurrency:
  group: pisjo-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build, Validate & Deploy to VPS
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci -d ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      CI_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      DEPLOY_DIR: /var/www/fish-market-platform
      PM2_APP_NAME: fish-market-platform
      PRODUCTION_URL: https://app.pusatikansegar.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
        run: pnpm exec prisma generate

      - name: Apply Prisma migrations
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
        run: pnpm exec prisma migrate deploy

      - name: Validate VAPID configuration
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: |
          node <<'NODE'
          const webpush = require("web-push");

          const publicKey = process.env.VAPID_PUBLIC_KEY?.trim();
          const privateKey = process.env.VAPID_PRIVATE_KEY?.trim();
          const subject = process.env.VAPID_SUBJECT?.trim();

          console.log("VAPID_PUBLIC_KEY:", publicKey ? `SET (${publicKey.length} chars)` : "MISSING");
          console.log("VAPID_PRIVATE_KEY:", privateKey ? `SET (${privateKey.length} chars)` : "MISSING");
          console.log("VAPID_SUBJECT:", subject ? "SET" : "MISSING");

          if (!publicKey || !privateKey || !subject) {
            throw new Error("VAPID environment variable is missing");
          }

          webpush.setVapidDetails(subject, publicKey, privateKey);
          console.log("VAPID_CONFIG_OK");
          NODE

      - name: Build production
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
          DEPLOYMENT_VERSION: ${{ github.sha }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          NEXT_PUBLIC_ONESIGNAL_APP_ID: ${{ vars.NEXT_PUBLIC_ONESIGNAL_APP_ID }}
        run: pnpm build

      - name: Verify production build
        shell: bash
        run: |
          set -euo pipefail
          echo "========================================"
          echo "PRODUCTION BUILD VERIFICATION"
          echo "========================================"

          test -s ".next/BUILD_ID"
          BUILD_ID="$(cat .next/BUILD_ID)"
          echo "Commit SHA : $GITHUB_SHA"
          echo "Build ID   : $BUILD_ID"
          echo "Branch     : $GITHUB_REF_NAME"

          count_marker() {
            local marker="$1"
            grep -R --include='*.js' -o "$marker" .next/server 2>/dev/null \
              | wc -l | tr -d ' '
          }

          PRODUCT_COUNT="$(count_marker '"@type":"Product"')"
          OFFER_COUNT="$(count_marker '"@type":"AggregateOffer"')"
          BREADCRUMB_COUNT="$(count_marker '"@type":"BreadcrumbList"')"
          PRODUCTION_DOMAIN_COUNT="$(count_marker 'https://app\.pusatikansegar\.com')"

          echo "Product count            : $PRODUCT_COUNT"
          echo "AggregateOffer count     : $OFFER_COUNT"
          echo "BreadcrumbList count     : $BREADCRUMB_COUNT"
          echo "Production domain count  : $PRODUCTION_DOMAIN_COUNT"

          test "$PRODUCT_COUNT" -ge 1 || { echo "ERROR: Product JSON-LD not found"; exit 1; }
          test "$OFFER_COUNT" -ge 1 || { echo "ERROR: AggregateOffer JSON-LD not found"; exit 1; }
          test "$BREADCRUMB_COUNT" -ge 1 || { echo "ERROR: BreadcrumbList JSON-LD not found"; exit 1; }
          test "$PRODUCTION_DOMAIN_COUNT" -ge 1 || { echo "ERROR: Production domain not found"; exit 1; }

          LOCALHOST_COUNT="$(
            grep -R --include='*.js' -oE 'https?://localhost(:[0-9]+)?' .next/server 2>/dev/null \
              | wc -l | tr -d ' '
          )"
          echo "Localhost references    : $LOCALHOST_COUNT"
          if [ "$LOCALHOST_COUNT" -gt 0 ]; then
            echo "WARNING: localhost references exist in the server bundle."
          fi

          echo "BUILD_VERIFICATION=PASS"

      - name: Package Prisma Client for production artifact
        shell: bash
        run: |
          set -euo pipefail
          echo "========================================"
          echo "PACKAGE PRISMA CLIENT"
          echo "========================================"

          PRISMA_CLIENT_DIR="$(
            find node_modules/.pnpm -type d \
              -path '*/node_modules/.prisma/client' -print -quit
          )"

          test -n "$PRISMA_CLIENT_DIR" || { echo "ERROR: Generated Prisma Client not found"; exit 1; }
          echo "Generated Prisma Client: $PRISMA_CLIENT_DIR"

          test -f "$PRISMA_CLIENT_DIR/libquery_engine-debian-openssl-3.0.x.so.node" || {
            echo "ERROR: Linux Prisma query engine not found"
            exit 1
          }

          mkdir -p .next/node_modules/.prisma/client
          cp -a "$PRISMA_CLIENT_DIR"/. .next/node_modules/.prisma/client/

          test -f ".next/node_modules/.prisma/client/default.js"
          test -f ".next/node_modules/.prisma/client/libquery_engine-debian-openssl-3.0.x.so.node"

          node -e '
            const p = require("./.next/node_modules/.prisma/client/default.js");
            if (typeof p.PrismaClient !== "function") throw new Error("PrismaClient export is not available");
            console.log("ROOT_PACKAGED_PRISMA_CLIENT_OK");
          '

          FOUND_PRISMA_PACKAGE=false
          for PKG in .next/node_modules/@prisma/client-*; do
            if [ ! -d "$PKG" ]; then continue; fi
            FOUND_PRISMA_PACKAGE=true
            mkdir -p "$PKG/node_modules/.prisma"
            rm -rf "$PKG/node_modules/.prisma/client"
            cp -a .next/node_modules/.prisma/client "$PKG/node_modules/.prisma/"
            test -f "$PKG/node_modules/.prisma/client/default.js"
            test -f "$PKG/node_modules/.prisma/client/libquery_engine-debian-openssl-3.0.x.so.node"
          done

          if [ "$FOUND_PRISMA_PACKAGE" = false ]; then
            echo "ERROR: No hashed @prisma/client-* package found"
            exit 1
          fi

          echo "PRISMA_PACKAGING=PASS"

      - name: Package Prisma migrations for production artifact
        shell: bash
        run: |
          set -euo pipefail
          echo "========================================"
          echo "PACKAGE PRISMA MIGRATIONS"
          echo "========================================"

          test -f prisma/schema.prisma || { echo "ERROR: prisma/schema.prisma not found"; exit 1; }
          test -d prisma/migrations || { echo "ERROR: prisma/migrations not found"; exit 1; }

          mkdir -p .next/deploy-meta/prisma
          cp prisma/schema.prisma .next/deploy-meta/prisma/schema.prisma
          cp -a prisma/migrations .next/deploy-meta/prisma/

          MIGRATION_COUNT="$(find .next/deploy-meta/prisma/migrations -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')"
          echo "Prisma migrations packaged: $MIGRATION_COUNT"
          test "$MIGRATION_COUNT" -ge 1
          echo "PRISMA_MIGRATION_PACKAGING=PASS"

      - name: Create artifact metadata
        shell: bash
        run: |
          set -euo pipefail
          BUILD_ID="$(cat .next/BUILD_ID)"
          mkdir -p .next/deploy-meta
          cat > .next/deploy-meta/build-info.txt <<EOF
          COMMIT_SHA=$GITHUB_SHA
          BRANCH=$GITHUB_REF_NAME
          BUILD_ID=$BUILD_ID
          WORKFLOW_RUN_ID=$GITHUB_RUN_ID
          WORKFLOW_RUN_NUMBER=$GITHUB_RUN_NUMBER
          REPOSITORY=$GITHUB_REPOSITORY
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          EOF
          cat .next/deploy-meta/build-info.txt

      - name: Package production artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -f next-production-build.zip
          cd .next
          zip -qr ../next-production-build.zip .
          cd ..

          ls -lh next-production-build.zip
          echo "=== BUILD ID ==="
          unzip -p next-production-build.zip BUILD_ID
          echo "=== METADATA ==="
          unzip -p next-production-build.zip deploy-meta/build-info.txt
          echo "=== ZIP TEST ==="
          unzip -t next-production-build.zip >/tmp/next-artifact-test.log
          tail -5 /tmp/next-artifact-test.log
          echo "=== SHA256 ==="
          sha256sum next-production-build.zip

      - name: Validate production artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s next-production-build.zip
          unzip -t next-production-build.zip >/tmp/next-artifact-final-test.log

          ARTIFACT_BUILD_ID="$(unzip -p next-production-build.zip BUILD_ID)"
          ARTIFACT_COMMIT="$(
            unzip -p next-production-build.zip deploy-meta/build-info.txt \
              | awk -F= '$1=="COMMIT_SHA"{print $2}'
          )"

          echo "Artifact BUILD_ID: $ARTIFACT_BUILD_ID"
          echo "Artifact COMMIT  : $ARTIFACT_COMMIT"
          test -n "$ARTIFACT_BUILD_ID"
          test "$ARTIFACT_COMMIT" = "$GITHUB_SHA"

          TMP_ARTIFACT="/tmp/pisjo-artifact-validation"
          rm -rf "$TMP_ARTIFACT"
          mkdir -p "$TMP_ARTIFACT"
          unzip -q next-production-build.zip -d "$TMP_ARTIFACT"

          test -s "$TMP_ARTIFACT/BUILD_ID"
          test -s "$TMP_ARTIFACT/deploy-meta/build-info.txt"
          test -f "$TMP_ARTIFACT/node_modules/.prisma/client/libquery_engine-debian-openssl-3.0.x.so.node"
          test -f "$TMP_ARTIFACT/deploy-meta/prisma/schema.prisma"
          test -d "$TMP_ARTIFACT/deploy-meta/prisma/migrations"
          test "$(find "$TMP_ARTIFACT/deploy-meta/prisma/migrations" -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')" -ge 1

          for marker in Product AggregateOffer BreadcrumbList; do
            case "$marker" in
              Product) pattern='"@type":"Product"' ;;
              AggregateOffer) pattern='"@type":"AggregateOffer"' ;;
              BreadcrumbList) pattern='"@type":"BreadcrumbList"' ;;
            esac
            count="$(grep -R --include='*.js' -o "$pattern" "$TMP_ARTIFACT/server" 2>/dev/null | wc -l | tr -d ' ')"
            echo "$marker: $count"
            test "$count" -ge 1 || { echo "ERROR: $marker JSON-LD missing"; exit 1; }
          done

          echo "ARTIFACT_VALIDATION=PASS"

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-production-build-${{ github.sha }}
          path: next-production-build.zip
          if-no-files-found: error
          retention-days: 7

      - name: Build artifact summary
        if: success()
        run: |
          echo "========================================"
          echo "PISJO MARKET BUILD COMPLETE"
          echo "========================================"
          echo "Commit : $GITHUB_SHA"
          echo "Branch : $GITHUB_REF_NAME"
          echo "Artifact: next-production-build-$GITHUB_SHA"
          echo "Deployment is handled by deploy-production.yml."
